<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormIQ — AI Forms Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./popup.js"></script>
  <link rel="stylesheet" crossorigin href="./popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-wrapper">
        <img src="logo.png" class="logo-img" alt="FormIQ Logo">
        <div class="logo-text">
          <div class="logo-title-row">
            <h1>FormIQ</h1>
            <span class="pro-badge">AI</span>
          </div>
          <span class="logo-subtitle">Google Forms Assistant</span>
        </div>
      </div>
      <div class="status-indicator" id="statusIndicator">
        <span class="dot"></span>
        <span class="status-text" id="statusText">Готов</span>
      </div>
    </header>

    <!-- Main Settings Form -->
    <main class="content">
      <!-- API Key Field -->
      <div class="form-group">
        <label for="apiKey">
          <span>Gemini API Key</span>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-hint">Получить ключ ↗</a>
        </label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="apiKey" 
            placeholder="AIzaSy..." 
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="toggleApiKey" class="icon-btn" title="Показать/скрыть ключ">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Model Selector -->
      <div class="form-group">
        <label for="modelSelect">Модель Gemini</label>
        <select id="modelSelect">
          <option value="gemini-3.6-flash" selected>Gemini 3.6 Flash (Быстрая, рекомендуемая)</option>
          <option value="gemini-3.6-pro">Gemini 3.6 Pro (Максимальная точность)</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        </select>
      </div>

      <!-- Font Selector -->
      <div class="form-group">
        <label for="fontSelect">Стиль шрифта</label>
        <select id="fontSelect">
          <option value="outfit" selected>Outfit (Геометрический премиум)</option>
          <option value="jakarta">Plus Jakarta Sans (Современный нео-гротеск)</option>
          <option value="manrope">Manrope (Четкий технологичный)</option>
          <option value="space-grotesk">Space Grotesk (Футуристичный)</option>
          <option value="inter">Inter (Классический)</option>
        </select>
      </div>

      <!-- Language Selector -->
      <div class="form-group">
        <label for="languageSelect">Язык объяснений</label>
        <select id="languageSelect">
          <option value="auto">Авто (Язык вопроса)</option>
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </div>

      <!-- Toggles -->
      <div class="toggles-group">
        <label class="toggle-control">
          <input type="checkbox" id="autoScrollCheck" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label">Автопрокрутка к вопросу</span>
        </label>
      </div>

      <!-- Test Connection & Save Action Buttons -->
      <div class="action-buttons">
        <button type="button" id="testBtn" class="btn btn-secondary">
          <span class="btn-spinner" id="testSpinner"></span>
          <span class="btn-text">Проверить</span>
        </button>
        <button type="button" id="saveBtn" class="btn btn-primary">
          <span class="btn-text">Сохранить</span>
        </button>
      </div>

      <!-- Test Feedback Toast/Banner -->
      <div id="feedbackBanner" class="feedback-banner hidden">
        <div class="banner-icon" id="bannerIcon"></div>
        <div class="banner-message" id="bannerMessage"></div>
      </div>

      <!-- Quick Info / Help card -->
      <div class="quick-guide">
        <div class="guide-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
          <span>Как использовать</span>
        </div>
        <p class="guide-text">
          Откройте Google Форму — возле каждого вопроса будет кнопка <b>«Решить»</b>. В правом нижнем углу находится виджет <b>FormIQ</b> для быстрого решения всех заданий.
        </p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>FormIQ v1.0.0</span>
      <a href="https://aistudio.google.com" target="_blank">Google AI Studio</a>
    </footer>
  </div>

</body>
</html>
