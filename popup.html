<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms Assistant</title>
  <link rel="stylesheet" href="./src/popup/popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-wrapper">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Forms Assistant</h1>
        </div>
      </div>
      <div class="status-indicator" id="statusIndicator">
        <span class="dot"></span>
        <span class="status-text" id="statusText">Готов к работе</span>
      </div>
    </header>

    <!-- Main Settings Form -->
    <main class="content">
      <!-- API Key Field -->
      <div class="form-group">
        <label for="apiKey">
          <span>API Ключ</span>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-hint">Получить ключ ↗</a>
        </label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="apiKey" 
            placeholder="Вставьте ключ..." 
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="toggleApiKey" class="icon-btn" title="Показать/скрыть">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Model Selector -->
      <div class="form-group">
        <label for="modelSelect">Режим работы</label>
        <select id="modelSelect">
          <option value="gemini-3.6-flash" selected>Быстрый режим (3.6 Flash)</option>
          <option value="gemini-3.6-pro">Точный режим (3.6 Pro)</option>
          <option value="gemini-2.5-flash">Базовый режим (2.5 Flash)</option>
        </select>
      </div>

      <!-- Language Selector -->
      <div class="form-group">
        <label for="languageSelect">Язык пояснений</label>
        <select id="languageSelect">
          <option value="auto">Авто (Язык вопроса)</option>
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </div>

      <!-- Toggles -->
      <div class="toggles-group">
        <label class="toggle-control">
          <input type="checkbox" id="autoScrollCheck" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label">Автопрокрутка к вопросу</span>
        </label>
      </div>

      <!-- Test Connection & Save Action Buttons -->
      <div class="action-buttons">
        <button type="button" id="testBtn" class="btn btn-secondary">
          <span class="btn-spinner" id="testSpinner"></span>
          <span class="btn-text">Проверить</span>
        </button>
        <button type="button" id="saveBtn" class="btn btn-primary">
          <span class="btn-text">Сохранить</span>
        </button>
      </div>

      <!-- Test Feedback Toast/Banner -->
      <div id="feedbackBanner" class="feedback-banner hidden">
        <div class="banner-icon" id="bannerIcon"></div>
        <div class="banner-message" id="bannerMessage"></div>
      </div>

      <!-- Quick Info / Help accordion -->
      <div class="quick-guide">
        <div class="guide-title">
          <span>Справка</span>
        </div>
        <p class="guide-text">
          Возле каждого вопроса в Google Формах отображается кнопка <b>«Подсказать»</b> для быстрого выбора ответа и просмотра пояснения.
        </p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Версия 1.0.0</span>
      <a href="https://aistudio.google.com" target="_blank">Google AI Studio</a>
    </footer>
  </div>

  <script type="module" src="./src/popup/popup.ts"></script>
</body>
</html>
