<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormIQ — AI Forms Assistant</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-wrapper">
        <img src="logo.png" class="logo-img" alt="FormIQ Logo">
        <div class="logo-text">
          <div class="logo-title-row">
            <h1>FormIQ</h1>
            <span class="pro-badge">AI</span>
          </div>
          <span class="logo-subtitle">Google Forms Assistant</span>
        </div>
      </div>
      <div class="status-indicator" id="statusIndicator">
        <span class="dot"></span>
        <span class="status-text" id="statusText">Ready</span>
      </div>
    </header>

    <!-- Main Settings Form -->
    <main class="content">
      <!-- API Key Field -->
      <div class="form-group">
        <label for="apiKey">
          <span>Gemini API Key</span>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-hint">Get API Key ↗</a>
        </label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="apiKey" 
            placeholder="AIzaSy..." 
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="toggleApiKey" class="icon-btn" title="Show / Hide API Key">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Model Selector -->
      <div class="form-group">
        <label for="modelSelect">
          <span>Gemini Model</span>
          <button type="button" id="refreshModelsBtn" class="link-hint-btn" title="Fetch active models from your Gemini API Key">🔄 Fetch Models</button>
        </label>
        <select id="modelSelect">
          <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (Fast, Recommended)</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro (Highest Accuracy)</option>
          <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite (Fast & Lightweight)</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash-Lite</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
          <option value="gemini-1.5-flash-8b">Gemini 1.5 Flash-8B</option>
        </select>
      </div>

      <!-- Font Selector -->
      <div class="form-group">
        <label for="fontSelect">Font Style</label>
        <select id="fontSelect">
          <option value="outfit" selected>Outfit (Geometric Premium)</option>
          <option value="jakarta">Plus Jakarta Sans (Modern Neo-Grotesque)</option>
          <option value="manrope">Manrope (Clean & Tech)</option>
          <option value="space-grotesk">Space Grotesk (Futuristic)</option>
          <option value="inter">Inter (Classic)</option>
        </select>
      </div>

      <!-- Language Selector -->
      <div class="form-group">
        <label for="languageSelect">Explanation Language</label>
        <select id="languageSelect">
          <option value="auto">Auto (Match Question)</option>
          <option value="en">English</option>
          <option value="ru">Russian</option>
        </select>
      </div>

      <!-- Toggles -->
      <div class="toggles-group">
        <label class="toggle-control">
          <input type="checkbox" id="autoScrollCheck" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label">Auto-scroll to current question</span>
        </label>
      </div>

      <!-- Test Connection & Save Action Buttons -->
      <div class="action-buttons">
        <button type="button" id="testBtn" class="btn btn-secondary">
          <span class="btn-spinner" id="testSpinner"></span>
          <span class="btn-text">Test Key</span>
        </button>
        <button type="button" id="saveBtn" class="btn btn-primary">
          <span class="btn-text">Save Settings</span>
        </button>
      </div>

      <!-- Test Feedback Toast/Banner -->
      <div id="feedbackBanner" class="feedback-banner hidden">
        <div class="banner-icon" id="bannerIcon"></div>
        <div class="banner-message" id="bannerMessage"></div>
      </div>

      <!-- Quick Info / Help card -->
      <div class="quick-guide">
        <div class="guide-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
          <span>How to Use</span>
        </div>
        <p class="guide-text">
          Open any Google Form — each question will feature a <b>"Solve"</b> button. Use the floating <b>FormIQ</b> dock in the bottom right to solve the entire form at once.
        </p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>FormIQ v1.0.0</span>
      <a href="https://aistudio.google.com" target="_blank">Google AI Studio</a>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
